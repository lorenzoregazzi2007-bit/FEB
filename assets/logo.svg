<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="forestGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <rect width="400" height="400" rx="48" fill="#0c100e"/>
  
  <!-- Outer Forest Green Border Ring -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="url(#forestGlow)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="200" cy="180" r="126" fill="#111714" stroke="#2d6a4f" stroke-width="2"/>
  
  <!-- Barber Scissors subtle watermark -->
  <path d="M165,135 L235,225 M235,135 L165,225" stroke="#1f2d24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Classic Monogram "B" Serif Luxury -->
  <g filter="url(#subtleGlow)">
    <!-- Main stem -->
    <path d="M160 115 H205 C232 115 244 128 244 146 C244 160 235 170 220 174 C238 178 248 190 248 206 C248 226 233 240 205 240 H160 V115 Z M182 133 V167 H202 C218 167 225 158 225 149 C225 140 217 133 202 133 H182 Z M182 184 V222 H205 C220 222 228 213 228 203 C228 192 219 184 204 184 H182 Z" 
          fill="url(#forestGlow)" />
  </g>
  
  <!-- Inner gold serif highlights -->
  <path d="M162 115 H195 M162 240 H195 M182 115 V240" stroke="#52b788" stroke-width="1.5" opacity="0.5"/>

  <!-- Star accents -->
  <polygon points="200,82 203,89 211,89 205,94 207,101 200,97 193,101 195,94 189,89 197,89" fill="#52b788" />
  
  <!-- Ribbon Banner Bottom -->
  <text x="200" y="340" font-family="'Syne', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="8" fill="#f8fafc" text-anchor="middle">BARBER FEB</text>
  <text x="200" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#52b788" text-anchor="middle">MINERBIO • BOLOGNA</text>
</svg>
