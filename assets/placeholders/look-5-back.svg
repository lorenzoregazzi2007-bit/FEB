<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Minimal Pure Black Canvas -->
  <rect width="800" height="600" fill="#080808"/>

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#181818" stroke-width="1"/>

  <!-- Quiet Editorial Head Silhouette -->
  <g opacity="0.35">
    <ellipse cx="400" cy="270" rx="90" ry="120" fill="#141414" stroke="#222222" stroke-width="1"/>
    <path d="M310 260 Q400 170 490 260" stroke="#282828" stroke-width="2" fill="none"/>
    <rect x="375" y="390" width="50" height="60" fill="#141414"/>
  </g>

  <!-- Clean Minimalist Typography -->
  <text x="50" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#588b6b">COLORE</text>
  <text x="50" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="400" letter-spacing="1" fill="#ffffff">Meches & Fade</text>
  
  <!-- Subtle Angle Tag -->
  <text x="750" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#666666" text-anchor="end">VISTA POSTERIORE</text>

  <!-- Bottom Brand Mark -->
  <text x="50" y="545" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="#444444">BARBER FEB • MINERBIO</text>
  <text x="750" y="545" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" letter-spacing="2" fill="#333333" text-anchor="end">FOTO DIMOSTRATIVA</text>
</svg>