<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Minimalist Luxury Monogram B for Barber FEB -->
  <rect width="200" height="200" fill="#080808" rx="20"/>
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#1d2e24" stroke-width="1" rx="14"/>
  
  <!-- Refined Editorial "B" -->
  <text x="100" y="125" 
        font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', serif" 
        font-size="82" 
        font-weight="400" 
        letter-spacing="2"
        fill="#f5f5f5" 
        text-anchor="middle">B</text>

  <!-- Understated Forest Line -->
  <line x1="82" y1="145" x2="118" y2="145" stroke="#40775a" stroke-width="1.5"/>
</svg>
